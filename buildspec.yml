version: 0.2

phases:
  install:
    commands:
      - echo "Preparing static website deployment"

  build:
    commands:
      - echo "Validating website files"
      - test -f site/index.html
      - test -f site/style.css
      - test -f site/script.js
      - echo "Website validation successful"

artifacts:
  base-directory: site
  files:
    - '**/*'
