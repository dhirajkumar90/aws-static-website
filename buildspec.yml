version: 0.2

phases:
  install:
    commands:
      - echo "Preparing static website deployment"

  build:
    commands:
      - echo "Validating website files"
      - test -f index.html
      - test -f style.css
      - test -f script.js
      - echo "Website validation successful"

artifacts:
  files:
    - index.html
    - style.css
    - script.js